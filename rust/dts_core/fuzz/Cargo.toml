# Outside the workspace: libFuzzer is a test tool and stays out of the program's lock file and notices.
[package]
name = "dts_core_fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
dts_core = { path = ".." }
libfuzzer-sys = "0.4"
sancov_bounds = { path = "bounds" }

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[workspace]
