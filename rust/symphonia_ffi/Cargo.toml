[package]
name = "symphonia_ffi"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
camel_audio_engine = { path = "../audio_engine" }
symphonia = { version = "=0.5.5", default-features = false, features = ["flac", "wav", "aiff", "pcm", "isomp4", "alac"] }
